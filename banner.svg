<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090c12" />
      <stop offset="50%" stop-color="#0d111a" />
      <stop offset="100%" stop-color="#12101b" />
    </linearGradient>

    <!-- Arch Cyan to Gentoo Purple Gradient -->
    <linearGradient id="arch-gentoo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1793d1" />
      <stop offset="55%" stop-color="#6e56af" />
      <stop offset="100%" stop-color="#a475f9" />
    </linearGradient>

    <!-- Accent Glow Gradient -->
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1793d1" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#a475f9" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#1793d1" stop-opacity="0" />
    </linearGradient>

    <!-- Card Border Gradient -->
    <linearGradient id="card-border" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#303646" />
      <stop offset="100%" stop-color="#1c202b" />
    </linearGradient>

    <!-- Ambient Radial Glows -->
    <radialGradient id="glow-left" cx="20%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#1793d1" stop-opacity="0.16" />
      <stop offset="50%" stop-color="#6e56af" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glow-right" cx="85%" cy="30%" r="40%">
      <stop offset="0%" stop-color="#a475f9" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Subtle Technical Grid Pattern -->
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#ffffff" stroke-width="0.6" stroke-opacity="0.03" />
      <circle cx="36" cy="36" r="1" fill="#ffffff" fill-opacity="0.07" />
    </pattern>

    <!-- Soft Drop Shadow for Emblem -->
    <filter id="drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Base Canvas -->
  <rect width="1200" height="360" rx="14" fill="url(#bg-grad)" />
  <rect width="1200" height="360" rx="14" fill="url(#grid)" />
  <rect width="1200" height="360" rx="14" fill="url(#glow-left)" />
  <rect width="1200" height="360" rx="14" fill="url(#glow-right)" />

  <!-- Decorative Circuit / Pipeline Traces (Background) -->
  <g stroke="#232a3b" stroke-width="1.5" fill="none" opacity="0.65">
    <path d="M 0 65 H 95 L 125 95 H 210" />
    <path d="M 0 295 H 110 L 140 265 H 240" />
    <path d="M 880 0 V 35 L 910 65 H 1200" />
    <path d="M 940 360 V 325 L 970 295 H 1200" />
    <circle cx="210" cy="95" r="3" fill="#1793d1" stroke="none" opacity="0.5" />
    <circle cx="240" cy="265" r="3" fill="#a475f9" stroke="none" opacity="0.5" />
  </g>

  <!-- ==================== LEFT: HYBRID ARCH x GENTOO EMBLEM ==================== -->
  <g transform="translate(185, 180)" filter="url(#drop-shadow)">
    <!-- Outer Octagonal Precision Ring -->
    <polygon points="0,-122 86,-86 122,0 86,86 0,122 -86,86 -122,0 -86,-86" fill="#0d1118" fill-opacity="0.75" stroke="#262f42" stroke-width="1.5" />
    
    <!-- Inner Dashed Telemetry Ring -->
    <circle cx="0" cy="0" r="98" fill="none" stroke="url(#arch-gentoo)" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.6" />
    <circle cx="0" cy="0" r="84" fill="none" stroke="#1e2636" stroke-width="1" />

    <!-- Stylized Arch Linux A-Peak Silhouette -->
    <path d="M 0 -76 
             C -10 -48, -22 -22, -38 10 
             C -26 2, -14 -2, 0 -4 
             C -16 -26, -20 -42, 0 -64 
             C 20 -42, 16 -26, 0 -4 
             C 14 -2, 26 2, 38 10 
             C 22 -22, 10 -48, 0 -76 Z
             M -44 22
             C -54 42, -64 58, -74 74
             C -50 60, -32 52, -16 49
             C -18 36, -12 20, 0 18
             C 12 20, 18 36, 16 49
             C 32 52, 50 60, 74 74
             C 64 58, 54 42, 44 22
             C 28 12, 14 8, 0 8
             C -14 8, -28 12, -44 22 Z" fill="url(#arch-gentoo)" />

    <!-- Gentoo Spiral Cutout / Core Overlay -->
    <path d="M -8 2
             C 12 -14, 38 -4, 36 20
             C 34 42, 8 54, -16 44
             C -42 34, -52 2, -36 -24
             C -18 -52, 20 -60, 48 -40" fill="none" stroke="#e2e8f0" stroke-width="4" stroke-linecap="round" opacity="0.85" />
    
    <!-- Core Node -->
    <circle cx="6" cy="16" r="6" fill="#090c12" stroke="#1793d1" stroke-width="3" />

    <!-- Corner Register Ticks -->
    <path d="M -112 -96 L -96 -112 M 96 -112 L 112 -96 M -112 96 L -96 112 M 96 112 L 112 96" stroke="#1793d1" stroke-width="2" opacity="0.6" />
  </g>

  <!-- ==================== CENTER: TYPOGRAPHY & FLAGS ==================== -->
  <g transform="translate(355, 0)">
    <!-- Top Status Pill -->
    <g transform="translate(0, 56)">
      <rect x="0" y="0" width="415" height="26" rx="5" fill="#131824" stroke="#263044" stroke-width="1" />
      <circle cx="14" cy="13" r="4" fill="#1793d1" />
      <text x="28" y="17" font-family="ui-monospace, &#39;JetBrains Mono&#39;, &#39;Fira Code&#39;, monospace" font-size="11.5" fill="#94a3b8" letter-spacing="0.8">
        SOURCE-FIRST PACKAGING <tspan fill="#475569">::</tspan> <tspan fill="#a475f9">ARCH / CACHYOS</tspan>
      </text>
    </g>

    <!-- Main Repository Title -->
    <text x="0" y="142" font-family="system-ui, -apple-system, &#39;Segoe UI&#39;, Roboto, Helvetica, Arial, sans-serif" font-size="54" font-weight="800" fill="#f8fafc" letter-spacing="-1">
      gentoo<tspan fill="#475569" font-weight="300">-</tspan>style<tspan fill="#475569" font-weight="300">-</tspan><tspan fill="url(#arch-gentoo)">arch</tspan>
    </text>

    <!-- Subtitle / Conceptual Description -->
    <text x="2" y="178" font-family="system-ui, -apple-system, &#39;Segoe UI&#39;, Roboto, sans-serif" font-size="16.5" fill="#94a3b8" font-weight="400" letter-spacing="0.2">
      Microarchitecture-tuned local build system, <tspan fill="#cbd5e1" font-weight="500">*-git</tspan> PKGBUILD orchestration,
    </text>
    <text x="2" y="202" font-family="system-ui, -apple-system, &#39;Segoe UI&#39;, Roboto, sans-serif" font-size="16.5" fill="#94a3b8" font-weight="400" letter-spacing="0.2">
      and profile-guided LLVM/Clang compilation for Arch Linux.
    </text>

    <!-- Horizontal Divider Line -->
    <rect x="0" y="224" width="520" height="1.5" fill="url(#cyan-glow)" />

    <!-- Compiler & Optimization Badges -->
    <g transform="translate(0, 244)" font-family="ui-monospace, &#39;JetBrains Mono&#39;, &#39;Fira Code&#39;, monospace" font-size="12" font-weight="600">
      <!-- Badge 1: march=native -->
      <rect x="0" y="0" width="138" height="28" rx="4" fill="#111927" stroke="#1793d1" stroke-width="1" stroke-opacity="0.6" />
      <text x="12" y="18" fill="#38bdf8">-march=native</text>

      <!-- Badge 2: LTO / PGO -->
      <rect x="148" y="0" width="154" height="28" rx="4" fill="#161426" stroke="#a475f9" stroke-width="1" stroke-opacity="0.6" />
      <text x="160" y="18" fill="#c084fc">-flto=thin + PGO</text>

      <!-- Badge 3: Kernel / Sched -->
      <rect x="312" y="0" width="166" height="28" rx="4" fill="#121824" stroke="#334155" stroke-width="1" />
      <text x="324" y="18" fill="#cbd5e1">AutoFDO / Propeller</text>

      <!-- Badge 4: Paru / Makepkg -->
      <rect x="488" y="0" width="128" height="28" rx="4" fill="#121824" stroke="#334155" stroke-width="1" />
      <text x="500" y="18" fill="#94a3b8">makepkg / paru</text>
    </g>

    <!-- Bottom Terminal Prompt Line -->
    <g transform="translate(2, 304)" font-family="ui-monospace, &#39;JetBrains Mono&#39;, &#39;Fira Code&#39;, monospace" font-size="12.5">
      <text x="0" y="0" fill="#1793d1" font-weight="700">❯</text>
      <text x="16" y="0" fill="#64748b">CFLAGS=</text>
      <text x="70" y="0" fill="#cbd5e1">"-O3 -march=native -mtune=native -pipe -fno-plt"</text>
      <text x="442" y="0" fill="#a475f9">makepkg -si</text>
      <rect x="534" y="-11" width="7" height="14" fill="#1793d1" opacity="0.8" />
    </g>
  </g>

  <!-- ==================== RIGHT: TELEMETRY / BUILD MATRIX ==================== -->
  <g transform="translate(935, 52)" font-family="ui-monospace, &#39;JetBrains Mono&#39;, &#39;Fira Code&#39;, monospace">
    <!-- Telemetry Container -->
    <rect x="0" y="0" width="225" height="256" rx="8" fill="#0b0f17" stroke="url(#card-border)" stroke-width="1.5" />
    
    <!-- Header Bar -->
    <rect x="0" y="0" width="225" height="32" rx="8" fill="#131926" />
    <line x1="0" y1="32" x2="225" y2="32" stroke="#222b3d" stroke-width="1" />
    <circle cx="16" cy="16" r="4" fill="#ef4444" opacity="0.7" />
    <circle cx="30" cy="16" r="4" fill="#f59e0b" opacity="0.7" />
    <circle cx="44" cy="16" r="4" fill="#10b981" opacity="0.7" />
    <text x="64" y="20" font-size="11" fill="#64748b" font-weight="600">BUILD::PIPELINE</text>

    <!-- Row 1: Toolchain -->
    <g transform="translate(16, 52)">
      <text x="0" y="0" font-size="10.5" fill="#64748b">TOOLCHAIN</text>
      <text x="0" y="16" font-size="12.5" fill="#e2e8f0" font-weight="600">Clang / LLVM + LLD</text>
      <rect x="0" y="24" width="193" height="3" rx="1.5" fill="#1e293b" />
      <rect x="0" y="24" width="175" height="3" rx="1.5" fill="#1793d1" />
    </g>

    <!-- Row 2: Target ISA -->
    <g transform="translate(16, 102)">
      <text x="0" y="0" font-size="10.5" fill="#64748b">MICROARCHITECTURE</text>
      <text x="0" y="16" font-size="12.5" fill="#e2e8f0" font-weight="600">Native ISA / AVX-512</text>
      <rect x="0" y="24" width="193" height="3" rx="1.5" fill="#1e293b" />
      <rect x="0" y="24" width="193" height="3" rx="1.5" fill="url(#arch-gentoo)" />
    </g>

    <!-- Row 3: Kernel & Scheduler -->
    <g transform="translate(16, 152)">
      <text x="0" y="0" font-size="10.5" fill="#64748b">KERNEL - SCHEDULER</text>
      <text x="0" y="16" font-size="12.5" fill="#e2e8f0" font-weight="600">CachyOS / BORE / RT</text>
      <rect x="0" y="24" width="193" height="3" rx="1.5" fill="#1e293b" />
      <rect x="0" y="24" width="160" height="3" rx="1.5" fill="#a475f9" />
    </g>

    <!-- Row 4: Package Tree -->
    <g transform="translate(16, 202)">
      <text x="0" y="0" font-size="10.5" fill="#64748b">NAMESPACE</text>
      <text x="0" y="16" font-size="12.5" fill="#38bdf8" font-weight="600">ZhangDM-520/arch</text>
      <text x="0" y="34" font-size="10.5" fill="#475569">STATUS: <tspan fill="#10b981">● OPTIMIZED</tspan></text>
    </g>
  </g>

  <!-- Outer Frame Border -->
  <rect x="0.75" y="0.75" width="1198.5" height="358.5" rx="13.25" fill="none" stroke="#263042" stroke-width="1.5" />
</svg>
