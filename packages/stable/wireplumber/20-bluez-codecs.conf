# Host policy: phone -> PC A2DP receives LDAC only (SBC kept as universal
# fallback). aptX/AAC are removed from the advertised codec set so a phone
# cannot auto-select them and silently fall below LDAC. PC -> headset (A2DP
# source) is unaffected: LDAC encode remains available.
monitor.bluez.properties = {
  bluez5.codecs = [ ldac, sbc ]
}
