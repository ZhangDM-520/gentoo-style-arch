# Topology: one record per package — the single source for the package
# map, group membership and build-order edges (config/packages.map,
# config/groups/*.list and config/dependencies.conf were merged here 2026-09-26).
#
# Record: id|path|groups|edges[|tags]
#   id      package id (recipe ID reference), [A-Za-z0-9._+-]+, unique
#   path    recipe directory (must contain a PKGBUILD), relative, no '..'
#   groups  comma-separated membership; the roster is exactly
#           git,stable,core,misc,app,build-tools and nothing else is
#           readable (third-party retired 2026-09-27 — its recipes live
#           in app). build-tools is the dispatch-first scheduling class
#           for compile toolchains: dual with core, and its members are
#           dispatched before all other ready packages without ever
#           overriding build-order edges
#   edges   comma-separated build-order dependencies (this package builds
#           after them); empty = deliberate no-edge record (trailing '|')
#   tags    optional comma-separated tags from the closed vocabulary:
#             abi=must    coupled-batch anchor or mandatory member: its batch
#                         rebuilds in one pass (see the batch gate in
#                         build-all.fish; a batch anchor is an abi=must
#                         package with no abi-tagged dependency)
#             abi=should  same-pass candidate: noted, never gated
#             app-cluster=<name>  prompt cluster: records sharing <name>
#                         collapse into one entry in the app-group picker
#                         (physically still separate recipes; multiple tags
#                         in one field are comma-separated)
# Records ALWAYS exist for every package. Loaded and validated on EVERY
# invocation — one malformed record breaks every command.
