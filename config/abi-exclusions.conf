# config/abi-exclusions.conf — the ABI-guard's Tier-2 documented exception
# registry. This file is WIRING, not prose: build-all.fish loads it on every
# invocation (read_abi_exclusions) and the ABI-drift guard consults it as
# resolution source (c): a name registered here is a DOCUMENTED exception to
# the soname closure rules, never a silent gap.
#
# Format — one entry per line, three '|'-separated fields:
#
#   id|reason|review-by
#
#   id        the excepted name. Either a package id/pkgname (its outputs are
#             exempt from the closure/provide checks) or a bare soname stem
#             (a NEEDED name the guard may leave unresolved without reporting
#             it). Allowed characters: A-Za-z0-9._+- .
#   reason    why the exception exists. Required, free text, no '|'.
#   review-by the ISO date (YYYY-MM-DD) by which the entry must be
#             re-justified or removed. Entries are documentation with an
#             expiry discipline; the loader validates the shape but does not
#             enforce the date.
#
# '#' comment lines and blank lines are ignored. A malformed entry breaks
# every builder command (the same strict-loader contract config/topology.conf
# has): an exception registry that silently misparses is exactly the silent
# gap this file exists to prevent.
#
# Seeded 2026-10-04 with the 35 exclusion-candidates of the consumer-targets
# analysis (/tmp/gsa-records/consumer-targets-final.txt, tier-hint column
# `exclusion-candidate`); review-by is set to 2027-04-01 for the whole seed
# wave so every entry gets a fresh justification within six months.
