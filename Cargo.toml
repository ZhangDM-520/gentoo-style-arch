[workspace]
resolver = "2"
members = [
    "crates/gsa-model",
    "crates/gsa-topo",
    "crates/gsa-recipe",
    "crates/gsa-graph",
    "crates/gsa-sched",
    "crates/gsa-build",
    "crates/gsa-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
gsa-model = { path = "crates/gsa-model" }
gsa-topo = { path = "crates/gsa-topo" }
gsa-recipe = { path = "crates/gsa-recipe" }
gsa-graph = { path = "crates/gsa-graph" }
gsa-sched = { path = "crates/gsa-sched" }
gsa-build = { path = "crates/gsa-build" }
serde = { version = "1", features = ["derive"] }

# Phase 1 of the native package manager (docs/gsa-contract.md). Phase 2 adds
# gsa-sched (lane supervisor: budgets, result codec, dispatch state machine,
# signals, locks, orphan sweeps) and gsa-build (makepkg orchestration). The
# remaining crates (gsa-install/gsa-fetch/gsa-state/gsa-qa/gsa-maint) arrive
# with their phases and are deliberately not stubbed out here
# (plan-native-pm.md §3.1, §7).
