[workspace]
resolver = "2"
members = [
    "crates/gsa-model",
    "crates/gsa-topo",
    "crates/gsa-recipe",
    "crates/gsa-graph",
    "crates/gsa-abi",
    "crates/gsa-sched",
    "crates/gsa-build",
    "crates/gsa-install",
    "crates/gsa-fetch",
    "crates/gsa-state",
    "crates/gsa-qa",
    "crates/gsa-maint",
    "crates/gsa-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
gsa-model = { path = "crates/gsa-model" }
gsa-topo = { path = "crates/gsa-topo" }
gsa-recipe = { path = "crates/gsa-recipe" }
gsa-graph = { path = "crates/gsa-graph" }
gsa-abi = { path = "crates/gsa-abi" }
gsa-sched = { path = "crates/gsa-sched" }
gsa-build = { path = "crates/gsa-build" }
gsa-install = { path = "crates/gsa-install" }
gsa-fetch = { path = "crates/gsa-fetch" }
gsa-state = { path = "crates/gsa-state" }
gsa-qa = { path = "crates/gsa-qa" }
gsa-maint = { path = "crates/gsa-maint" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
zstd = "0.13"
object = { version = "0.36", default-features = false, features = ["read", "elf"] }

# Phase 1 of the native package manager (docs/gsa-contract.md). Phase 2 adds
# gsa-sched (lane supervisor: budgets, result codec, dispatch state machine,
# signals, locks, orphan sweeps) and gsa-build (makepkg orchestration).
# Phase 3 adds gsa-install (the install pipeline) and Phase 4 gsa-fetch
# (fetch-ahead: `gsa -Sw` + the dispatcher's prefetch window) and gsa-state
# (the side-car state database under the state root: binpkg index, run
# history, key-value — docs/gsa-contract.md §J) and gsa-qa (the QA check
# registry: named checks with scope + severity + stable keyword, the
# install-qa-check.d analogue — plan-native-pm.md §5.3) and gsa-maint (the
# `-M` maintain surface: host-state hygiene, IgnorePkg closure repair,
# world/sets over the kv store, run-history inspection, the prune strengths,
# shared-source mirrors and the audit/doctor reports — plan-native-pm.md
# §5.1's `maintain`/`logs`/`clean` verbs, contract §B.7).
